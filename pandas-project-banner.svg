<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Pandas Projects</title>
  <desc id="description">A coffee cup and rising data chart on a dark blue background, representing Python pandas analysis projects.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b35"/>
      <stop offset="1" stop-color="#193e53"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6b2"/>
      <stop offset="1" stop-color="#73c9ff"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d99862"/>
      <stop offset="1" stop-color="#ad633e"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="45" r="155" fill="#54d6b2" opacity=".07"/>
  <circle cx="1000" cy="300" r="190" fill="#73c9ff" opacity=".06"/>
  <path d="M0 260 C210 220 320 310 520 270 S830 220 1040 270 S1160 290 1200 270 V320 H0Z" fill="#0b1428" opacity=".38"/>


    <rect x="80" y="151" width="245" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="198" fill="#c6d5e5" font-size="24">Data cleaning · Analysis · Visualization</text>
    <g transform="translate(80 235)">
